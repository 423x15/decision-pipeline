# config/skills.yaml
skills:
  - name: math_skills
    description: "Mathematical calculations, statistics, numerical conversions, dates and durations"
    tools: [calculator, datetime_tool]

  - name: search_skills
    description: "Information retrieval, facts, news, definitions, current events, prices, real-time data"
    tools: [web_search]

  - name: code_skills
    description: "Write, run, or debug Python code, scripts, algorithms, data transformations"
    tools: [code_runner]

  - name: text_skills
    description: "Text analysis, word counting, sentence splitting, keyword extraction"
    tools: [text_utils]

  - name: general_skills
    description: "General question that does not require a specific tool"
    tools: []
