# config/tools.yaml
tools:
  calculator:
    description: "Evaluates a mathematical expression (e.g. '1500 * 0.197', '(42 + 8) / 5')"
    input_hint: "mathematical expression as a string"

  datetime_tool:
    description: "Returns the current date and time, or computes the duration between two dates"
    input_hint: "temporal query in natural language"

  web_search:
    description: "Searches the web for real-time information: news, facts, prices, definitions, current events"
    input_hint: "search query as a string"

  code_runner:
    description: "Executes Python code in a sandboxed environment and returns stdout and variable values"
    input_hint: "Python code as a string or inside a ```python block"

  text_utils:
    description: "Analyses a text: counts words and sentences, extracts keywords"
    input_hint: "text to analyse"
